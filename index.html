<head>
<meta charset="UTF-8">

<title>Сервис генерации коммерческих предложений АЛЬФАПРОМ</title>
<style>
:root{--orange:#ff8100;--text:#202124;--muted:#6b7280;--border:#d9dce1;--bg:#f4f5f7;--green:#168a45;--red:#d93025}
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{width:100%;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:62px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:0 18px;background:#fff;border-bottom:2px solid var(--orange)}.topbar-title{font-size:18px;font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d3d6da;background:#fff;border-radius:8px;padding:9px 14px;font-weight:600;transition:.15s}.btn:hover{border-color:var(--orange)}.btn-primary{background:var(--orange);border-color:var(--orange);color:#fff}.btn-danger{color:#b42318}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:50% 50%}.editor{min-width:0;overflow:auto;padding:20px;background:#f7f8fa;border-right:1px solid #ddd}.editor-section{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}.editor-section h2{margin:0 0 16px;font-size:18px}.field{margin-bottom:14px}.field:last-child{margin-bottom:0}.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:700;color:#40444a}input[type=text],input[type=tel],input[type=number],input[type=url],textarea,select{width:100%;border:1px solid #cfd3d8;border-radius:8px;padding:10px 11px;background:#fff;color:var(--text);outline:none}input:focus,textarea:focus,select:focus{border-color:var(--orange)}textarea{min-height:90px;resize:vertical;line-height:1.45}.specs-textarea{min-height:170px}.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status-buttons{display:flex;gap:8px}.status-button{flex:1;border:1px solid #d3d6da;background:#fff;border-radius:8px;padding:9px;font-weight:600}.status-button.active{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}.status-button[data-status=available].active{color:var(--green)}.status-button[data-status=order].active{color:#b96a00}
.product-editor-card{background:#fff;border:1px solid #d7dbe0;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 7px rgba(0,0,0,.035)}.product-editor-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.product-editor-title{font-size:18px;font-weight:800}.product-number{color:var(--orange)}.remove-product-btn{border:1px solid #e0c9c6;background:#fff;color:#b42318;border-radius:7px;padding:7px 10px;font-size:12px;font-weight:700}.add-product-btn{width:100%;border:1px dashed var(--orange);background:#fff8f0;color:#c86400;border-radius:9px;padding:12px;font-weight:700;margin-bottom:16px}
.photo-editor{margin-bottom:14px}.photo-editor-grid{position:relative;min-height:24mm;width:100%;overflow:visible}.photo-editor-grid.photo-grid-dragging{min-height:120mm}.photo-editor-item{position:absolute;min-width:0;z-index:1}.photo-editor-item.photo-dragging{z-index:20;filter:drop-shadow(0 4px 8px rgba(0,0,0,.16))}.photo-editor-item.photo-drag-over{outline:2px dashed var(--orange);outline-offset:3px}.photo-drop{width:260px;height:260px;border:2px dashed #cfd3d8;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;background:#fafafa;overflow:hidden;position:relative;transition:border-color .15s,background .15s,box-shadow .15s;cursor:grab}.photo-drop:active{cursor:grabbing}.photo-drop:hover,.photo-drop.dragover{border-color:var(--orange);background:#fffaf5}.photo-drop.has-image{border-style:solid;border-color:#d7d9dc;background:#fff}.photo-drop img{width:100%;height:100%;object-fit:contain;display:block;padding:8px;pointer-events:none}.photo-crop-preview{width:100%;height:100%;overflow:hidden;position:relative;touch-action:none}.photo-crop-window{position:absolute;overflow:hidden;box-sizing:border-box;z-index:2}.photo-crop-editing .photo-crop-window{border:0;box-shadow:0 0 0 9999px rgba(255,255,255,.58)}.photo-crop-applied .photo-crop-window{border:0;box-shadow:none}.photo-crop-border{position:absolute;z-index:90;display:none;border:1px solid #ff8100;box-sizing:border-box;pointer-events:none}.photo-crop-editing .photo-crop-border,.photo-crop-dragging .photo-crop-border{display:block}.photo-crop-handle{margin:0!important}.photo-crop-undo{position:absolute;z-index:30;right:6px;bottom:36px;border:1px solid #d7d9dc;background:#fff;color:#555;border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.photo-crop-apply{position:absolute;z-index:30;right:6px;bottom:6px;border:1px solid #fff;background:#ff8100;color:#fff;border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25)}.photo-crop-preview img{position:absolute;max-width:none;max-height:none;object-fit:contain;padding:0;pointer-events:none}.photo-crop-handle{position:absolute;z-index:100;background:#ff8100;border:0;box-shadow:none;border-radius:0;display:block;visibility:visible;opacity:1;pointer-events:auto;box-sizing:border-box}.photo-crop-handle-top,.photo-crop-handle-bottom{width:42px;height:4px;left:0;cursor:ns-resize}.photo-crop-handle-left,.photo-crop-handle-right{width:4px;height:42px;top:0;cursor:ew-resize}.photo-crop-preview.photo-crop-dragging .photo-crop-window{border:0!important;box-shadow:0 0 0 9999px rgba(255,255,255,.58)}.photo-placeholder{color:#73777d;font-size:13px;line-height:1.5;padding:20px}.photo-item-remove{position:relative;z-index:20;margin-top:6px;width:100%;pointer-events:auto;border:1px solid #e0c9c6;background:#fff;color:#b42318;border-radius:7px;padding:6px 8px;font-size:12px}.photo-size-label{margin-top:5px;text-align:center;font-size:11px;color:#777}.photo-resize-handle{position:absolute;right:5px;bottom:5px;width:24px;height:24px;border-radius:6px;background:rgba(255,129,0,.96);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.28);cursor:nwse-resize;z-index:5}.photo-resize-handle:after{content:"";position:absolute;right:4px;bottom:4px;width:7px;height:7px;border-right:2px solid #fff;border-bottom:2px solid #fff}.photo-actions{margin-top:8px;padding-top:4px;display:flex;gap:8px;position:relative;z-index:2}.small-btn{border:1px solid #d3d6da;background:#fff;border-radius:7px;padding:7px 10px;font-size:12px}.file-input{display:none}
.preview-side{min-width:0;min-height:0;display:flex;flex-direction:column;background:#e8eaed}.preview-title{flex:none;height:48px;display:flex;align-items:center;padding:0 18px;background:#fff;border-bottom:1px solid #d7d9dc;font-size:16px;font-weight:700}.preview-scroll{flex:1;min-height:0;overflow:auto;padding:20px}.preview-pages{display:flex;flex-direction:column;align-items:center;gap:20px}.preview-page-shell{position:relative;flex:none}.preview-page-scaled{position:absolute;left:0;top:0;transform-origin:top left}
.kp-page{width:210mm;height:297mm;background:#fff;position:relative;box-shadow:0 3px 15px rgba(0,0,0,.14);display:flex;flex-direction:column;overflow:hidden;flex:none}.kp-content{flex:1;min-height:0;padding:7mm 15mm 6mm;overflow:hidden;display:flex;flex-direction:column}
.kp-page.has-bottom .kp-content{padding-bottom:0}
.kp-page.has-bottom .kp-bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  z-index:20;
  display:flex;
  flex-direction:column;
  flex:none;
}
.kp-footer-stack{
  width:100%;
  display:flex;
  flex-direction:column;
  flex:none;
}.kp-header{height:15mm;flex:none;display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid var(--orange);margin-bottom:3mm}.kp-logo{display:block;width:auto;height:10.5mm;max-width:78mm;object-fit:contain}.kp-header-right{text-align:right;font-size:9.5px;line-height:1.3;color:#3f4348}.kp-header-phone{font-size:12px;font-weight:800;color:#202124}.kp-header-site{color:var(--orange);font-weight:700;text-decoration:none}.kp-title{font-size:20px;font-weight:800;margin-bottom:2.5mm;line-height:1.1}.kp-product-name{font-size:18px;font-weight:750;line-height:1.18;margin-bottom:3mm}
.product-photo-grid{width:100%;display:flex;flex-wrap:wrap;align-items:flex-start;gap:4mm;margin-bottom:0}.product-photo-frame{flex:0 0 auto;border:1px solid #e0e2e5;border-radius:7px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}.product-photo-frame img{width:100%;height:100%;object-fit:contain;display:block;padding:2.5mm}.kp-description{font-size:12.2px;line-height:1.45;white-space:pre-wrap;margin-bottom:2.5mm}.kp-note{font-size:11.2px;color:#666;line-height:1.35;white-space:pre-wrap;margin-bottom:2.5mm}.specs-table{width:100%;border-collapse:collapse;font-size:10.2px;margin:1.5mm 0 2.5mm}.specs-table th,.specs-table td{border:1px solid #d9dce0;padding:4px 6px;text-align:left;vertical-align:top}.specs-table th{background:var(--orange);color:#fff;font-weight:800}.specs-table td:first-child{width:40%;font-weight:650}.video-button{display:inline-flex;align-items:center;gap:7px;margin:1mm 0 2.5mm;padding:7px 11px;border-radius:6px;background:#111;color:#fff;text-decoration:none;font-size:10.5px;font-weight:700}.video-button:before{content:"►";color:var(--orange);font-size:11px;line-height:1}.price-block{margin:1.5mm 0 2mm}.price-line{font-size:16px;font-weight:800;margin-bottom:1mm}.price-line.discount{color:var(--red)}.availability{font-size:12px;font-weight:800;margin-bottom:1.5mm}.availability.available{color:var(--green)}.availability.order{color:#b96a00}.price-comment{font-size:10.5px;color:#e0a15f;line-height:1.35;margin-bottom:2mm}
.kp-bottom{
  flex:0 0 auto;
  width:100%;
  break-inside:avoid;
  page-break-inside:avoid;
}
.advantages{
  flex:none;
  margin-top:0;
  padding:2.5mm 15mm 2.5mm;
  box-sizing:border-box;
  break-inside:avoid;
  page-break-inside:avoid;

  grid-column:2 / span 2;
  padding-top:5mm;
}.advantage:nth-child(5){grid-column:4 / span 2}
.kp-footer{flex:none;height:18mm;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8mm;padding:3.5mm 15mm}.footer-left{font-size:9px;font-weight:700;line-height:1.3}.footer-right{text-align:right;font-size:9px;line-height:1.35}.footer-manager{font-weight:800}.page-continuation{font-size:9px;color:#777;margin-bottom:2mm}

#pdfMeasure{position:absolute;left:-100000px;top:0;width:210mm;visibility:hidden;pointer-events:none}.pdf-render-root{width:210mm;background:#fff}.pdf-render-root .kp-page{box-shadow:none}.pdf-render-root .preview-page-shell{display:block!important}

function applyPhotoCropPreview(p,id,container,img){

function bindPhotoCropControls(p,item){
 const preview=item.querySelector(".photo-crop-preview");

       syncPhotoEditorFrame(p,item,id);

       if(undo)undo.style.display="none";

       value=Math.max(0,Math.min(89-opposite,value));
       setPhotoCrop(p,id,side,value);
       syncPhotoCropBorder(preview);
       updatePhotoCropHandles(p,id,preview);

   };
 });
}

function blockHtml(p,index,photos){const blocks=[];blocks.push(`<div class="kp-title">Коммерческое предложение</div>`);blocks.push(`<div class="kp-product-name">${escapeHtml(p.productName||`Оборудование №${index+1}`)}</div>`);if(photos.length){ensurePhotoPositions(p);let photoBottom=24;const photoHtml=photos.map((ph,i)=>{const s=getPhotoSize(p,ph.photoId);const pos=getPhotoPosition(p,ph.photoId);const crop=getPhotoCrop(p,ph.photoId);const applied=crop.applied===true;const x=applied?Math.min(89,crop.left+crop.right):0;const y=applied?Math.min(89,crop.top+crop.bottom):0;const frameW=s*(1-x/100);const frameH=s*(1-y/100);photoBottom=Math.max(photoBottom,pos.y+frameH+1.5);const imgLeft=applied?-(s*crop.left/100):0;const imgTop=applied?-(s*crop.top/100):0;return`<div class="product-photo-frame" style="position:absolute;left:${pos.x}mm;top:${pos.y}mm;width:${frameW}mm;height:${frameH}mm"><div class="photo-crop-preview" style="width:${s}mm;height:${s}mm;flex:none"><img src="${ph.dataUrl}" alt="Оборудование ${i+1}" style="width:${s}mm;height:${s}mm;left:${imgLeft}mm;top:${imgTop}mm"></div></div>`}).join("");blocks.push(`<div class="product-photo-grid" style="position:relative;height:${Math.max(24,photoBottom)}mm">${photoHtml}</div>`)}if(p.description.trim())blocks.push({type:"description",text:p.description});const rows=parseSpecs(p.specsText);if(rows.length)blocks.push({type:"specs",rows});if(p.note.trim())blocks.push(`<div class="kp-note">${escapeHtml(p.note)}</div>`);if(p.videoUrl.trim())blocks.push(`<a class="video-button" href="${escapeAttr(p.videoUrl)}" target="_blank" rel="noopener">Смотреть видео оборудования</a>`);const price=formatPrice(p.price,p.currency),disc=formatPrice(p.discountPrice,p.currency);if(price||disc)blocks.push(`<div class="price-block">${price?`<div class="price-line">Цена: ${price}</div>`:""}${disc?`<div class="price-line discount">Цена со скидкой: ${disc}</div>`:""}</div>`);blocks.push(`<div class="availability ${p.status==="order"?"order":"avail function specsTableHtml(rows){return`<table class="specs-table"><thead><tr><th colspan="2">Характеристики</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${escapeHtml(String(r[0]??""))}</td><td>${escapeHtml(String(r[1]??""))}</td></tr>`).join("")}</tbody></table>`}
async function measureHtmlHeight(html){const test=document.createElement("div");test.style.cssText="position:absolute;left:-100000px;top:0;visibility:hidden;width:180mm;box-sizing:border-box;";test.innerHTML=html;document.body.appendChild(test);const h=test.getBoundingClientRect().height;test.remove();return h}
async function fitDescriptionChunk(text,available){const source=String(text||"");if(!source)return"";const words=source.split(/(\s+)/);let lo=1,hi=words.length,best="";while(lo<=hi){const mid=(lo+hi)>>1;const candidate=words.slice(0,mid).join("");const h=await measureHtmlHeight(`<div class="kp-description">${escapeHtml(candidate)}</div>`);if(h<=available+0.5||!best){if(h<=available+0.5){best=candidate;lo=mid+1}else{hi=mid-1}}else hi=mid-1}return best.trimEnd()}
async function splitDescription(text,available){let rest=String(text||"").trim();const chunks=[];while(rest){const chunk=await fitDescriptionChunk(rest,available);if(!chunk)break;chunks.push(`<div class="kp-description">${escapeHtml(chunk)}</div>`);rest=rest.slice(chunk.length).trimStart()}return{chunks,rest}}
async function fitSpecsRows(rows,available){if(!rows.length)return 0;let lo=1,hi=rows.length,best=0;while(lo<=hi){const mid=(lo+hi)>>1;const html=specsTableHtml(rows.slice(0,mid));const h=await measureHtmlHeight(html);if(h<=available+0.5||mid===1){if(h<=available+0.5){best=mid;lo=mid+1}else hi=mid-1}else hi=mid-1}return best}

async function paginateProduct(p,index){
  const photos=await getProductPhotosData(p);
  const blocks=blockHtml(p,index,photos);

  async function measureAvailable(firstPage){
    const page=document.createElement("div");
    page.className="kp-page has-bottom";
    page.style.position="absolute";
    page.style.left="-100000px";
    page.style.top="0";
    page.style.visibility="hidden";
    page.style.boxShadow="none";
    page.innerHTML=
      '<div class="kp-content">'+
        headerHtml()+
        (!firstPage
          ? '<div class="page-continuation">Продолжение предложения — оборудование №'+(index+1)+'</div>'
          : '')+
        '<div class="measureBlocks"></div>'+
      '</div>'+
      '<div class="kp-bottom"><div class="kp-footer-stack">'+
        (firstPage?advantagesHtml():"")+
        footerHtml()+
      '</div></div>';
    document.body.appendChild(page);
    await new Promise(r=>requestAnimationFrame(r));
    const header=page.querySelector(".kp-header");
    const bottom=page.querySelector(".kp-bottom");
    const contentTop=header.getBoundingClientRect().bottom;
    const available=Math.max(0,bottom.getBoundingClientRect().top-contentTop);
    page.remove();
    return available;
  }

  const firstAvailable=await measureAvailable(true);
  const nextAvailable=await measureAvailable(false);
  const pages=[];
  let current=[];
  let currentHeight=0;
  let pageIndex=0;

  const pushPage=()=>{
    if(current.length)pages.push(current);
    current=[];
    currentHeight=0;
    pageIndex++;
  };

  const addHtml=async html=>{
    const available=pageIndex===0?firstAvailable:nextAvailable;
    const h=await measureHtmlHeight(html);
    if(current.length&&currentHeight+h>available+0.5)pushPage();
    current.push(html);
    currentHeight+=h;
  };

  for(const block of blocks){
    if(typeof block==="string"){
      await addHtml(block);
      continue;
    }

    if(block.type==="description"){
      let rest=String(block.text||"").trim();
      while(rest){
        const available=pageIndex===0?firstAvailable:nextAvailable;
        const chunk=await fitDescriptionChunk(rest,Math.max(0,available-currentHeight));
        if(!chunk){
          if(current.length)pushPage();
          else{
            const forced=await fitDescriptionChunk(rest,available);
            if(!forced)break;
            current.push('<div class="kp-description">'+escapeHtml(forced)+'</div>');
            currentHeight=await measureHtmlHeight(current.at(-1));
            rest=rest.slice(forced.length).trimStart();
          }
          continue;
        }
        const html='<div class="kp-description">'+escapeHtml(chunk)+'</div>';
        const h=await measureHtmlHeight(html);
        if(current.length&&currentHeight+h>available+0.5){pushPage();continue}
        current.push(html);
        currentHeight+=h;
        rest=rest.slice(chunk.length).trimStart();
      }
      continue;
    }

    if(block.type==="specs"){
      let remaining=block.rows.slice();
      while(remaining.length){
        const available=pageIndex===0?firstAvailable:nextAvailable;
        const room=Math.max(0,available-currentHeight);
        let count=await fitSpecsRows(remaining,room);
        if(count<1){
          if(current.length){pushPage();continue}
          count=await fitSpecsRows(remaining,available);
          if(count<1)count=1;
        }
        const html=specsTableHtml(remaining.slice(0,count));
        const h=await measureHtmlHeight(html);
        if(current.length&&currentHeight+h>available+0.5){pushPage();continue}
        current.push(html);
        currentHeight+=h;
        remaining=remaining.slice(count);
      }
      continue;
    }
  }

  if(current.length)pages.push(current);
  if(!pages.length)pages.push([]);

  return pages.map((arr,i)=>makePage(arr,index,i>0,true));
}
async function buildAllPages(){const all=[];for(let i=0;i<state.products.length;i++){const pages=await paginateProduct(state.products[i],i);all.push(...pages)}return all}

function fitPreviewPages(){const scroll=document.getElementById("previewScroll"),shells=document.querySelectorAll(".preview-page-shell");if(!scroll||!shells.length)return;const a4=getA4SizePx(),scale=Math.min(Math.max(100,scroll.clientWidth-40)/a4.width,Math.max(100,scroll.clientHeight-40)/a4.height);shells.forEach(s=>{s.style.width=a4.width*scale+"px";s.style.height=a4.height*scale+"px";const p=s.querySelector(".preview-page-scaled");if(p)p.style.transform=`scale(${scale})`})}

async function downloadPDF(){
  const b=document.getElementById("downloadPdfBtn");
  b.disabled=true;
  b.textContent="Формирование PDF...";

  let root=null;

  try{
    const pages=await buildAllPages();

    root=document.createElement("div");
    root.className="pdf-render-root";
    root.style.position="fixed";
    root.style.left="0";
    root.style.top="0";
    root.style.width="210mm";
    root.style.visibility="visible";
    root.style.zIndex="-1";
    root.innerHTML=pages.join("");

    document.body.appendChild(root);

    root.querySelectorAll(".kp-page").forEach((p,i)=>{
      p.style.pageBreakAfter="auto";
      p.style.breakAfter="auto";
    });

    await new Promise(r=>requestAnimationFrame(r));
    await new Promise(r=>setTimeout(r,100));

    const pdf=new window.jspdf.jsPDF({
      unit:"mm",
      format:"a4",
      orientation:"portrait"
    });

    const pageElements=[...root.querySelectorAll(".kp-page")];

    for(let i=0;i<pageElements.length;i++){
      const canvas=await window.html2canvas(pageElements[i],{
        scale:4,
        useCORS:true,
        backgroundColor:"#fff",
        logging:false,
        onclone:(clonedDoc)=>{
          clonedDoc
            .querySelectorAll('img[src^="blob:"]')
            .forEach(img=>img.remove());
        }
      });

      const imgData=canvas.toDataURL("image/jpeg",.94);

      if(i>0){
        pdf.addPage();
      }

      pdf.addImage(
        imgData,
        "JPEG",
        0,
        0,
        210,
        297,
        undefined,
        "MEDIUM"
      );
    }

    const filename=safeFileName(
      state.products[0]?.productName
    )+".pdf";

    pdf.save(filename);

  }catch(e){
    console.error(e);
    alert(
      "Не удалось сформировать PDF.\n\n"+
      (e.message||e)
    );
  }finally{
    root?.remove();
    b.disabled=false;
    b.textContent="Скачать PDF";
  }
}


async function blobToUint8Array(blob){
  return new Uint8Array(await blob.arrayBuffer());
}

                      link:url,
                      children:[
                        run("▶ ",{size:16,bold:true,color:ORANGE}),
                        run("Смотреть видео оборудования",{size:16,bold:true,color:"FFFFFF"})
                      ]
                    })
                  ],{alignment:docx.AlignmentType.LEFT,after:0})
                ]
              })
            ]
          })
        ],
        borders:{
          top:{style:docx.BorderStyle.NONE,size:0,color:"FFFFFF"},
          bottom:{style:docx.BorderStyle.NONE,size:0,color:"FFFFFF"},
          left:{style:docx.BorderStyle.NONE,size:0,color:"FFFFFF"},
          right:{style:docx.BorderStyle.NONE,size:0,color:"FFFFFF"},
          insideHorizontal:{style:docx.BorderStyle.NONE,size:0,color:"FFFFFF"},
          insideVertical:{style:docx.BorderStyle.NONE,size:0,color:"FFFFFF"}
        }
      })
    );
    children.push(blank(100));
  }

  function addDocxAdvantages(){
    children.push(paragraph([run("Почему мы?",{size:21,bold:true})],{
      alignment:docx.AlignmentType.CENTER,
      before:60,
      after:80,
      keepLines:true,
      keepNext:true
    }));

    const adv=DEFAULT_ADVANTAGES||[];
    const colW=Math.floor(CONTENT_W/6);
    const lastColW=CONTENT_W-colW*5;
    const cardW=colW*2;
    const borderNone={
      top:{style:docx.BorderStyle.NONE,size:0,color:"FFFFFF"},
      bottom:{style:docx.BorderStyle.NONE,size:0,color:"FFFFFF"},
      left:{style:docx.BorderStyle.NONE,size:0,color:"FFFFFF"},
      right:{style:docx.BorderStyle.NONE,size:0,color:"FFFFFF"}
    };

    const makeCard=(x)=>new docx.TableCell({
      columnSpan:2,
      width:{size:cardW,type:docx.WidthType.DXA},
      shading:{fill:"FAFAFA"},
      margins:{top:110,bottom:110,left:100,right:100},
      verticalAlign:docx.VerticalAlign.CENTER,
      borders:{top:thinBorder,bottom:thinBorder,left:thinBorder,right:thinBorder},
      children:[
        paragraph([
          run("✓ ",{size:15,bold:true,color:ORANGE}),
          run(x,{size:14,bold:true})
        ],{
          alignment:docx.AlignmentType.CENTER,
          after:0,
          line:205,
          keepLines:true
        })
      ]
    });

    const empty=(w,span=1)=>new docx.TableCell({
      columnSpan:span,
      width:{size:w,type:docx.WidthType.DXA},
      children:[paragraph([],{after:0,line:18})],
      borders:borderNone
    });

    // Единая 6-колоночная сетка = та же геометрия, что в превью:
    // 3 карточки сверху и 2 карточки снизу по центру.
    const advantagesTable=new docx.Table({
      width:{size:CONTENT_W,type:docx.WidthType.DXA},
      columnWidths:[colW,colW,colW,colW,colW,lastColW],
      layout:docx.TableLayoutType.FIXED,
      rows:[
        new docx.TableRow({
          cantSplit:true,
          children:[
            makeCard(adv[0]||""),
            makeCard(adv[1]||""),
            makeCard(adv[2]||"")
          ]
        }),
        new docx.TableRow({
          cantSplit:true,
          children:[
            empty(colW),
            makeCard(adv[3]||""),
            makeCard(adv[4]||""),
            empty(colW)
          ]
        })
      ],
      borders:{
        top:borderNone.top,
        bottom:borderNone.bottom,
        left:borderNone.left,
        right:borderNone.right,
        insideHorizontal:borderNone.top,
        insideVertical:borderNone.left
      }
    });

    children.push(advantagesTable);
  }
  function addDocxPageBlock(block,p){
    // paginateProduct() хранит описание и характеристики как объекты,
    // а остальные блоки — как HTML-строки. Обрабатываем оба формата.
    if(block && typeof block==="object"){
      if(block.type==="description"){
        children.push(
          paragraph([
            run(String(block.text||""),{size:18})
          ],{after:0,line:260})
        );
        return;
      }

      if(block.type==="specs"){
        addDocxSpecsTable(Array.isArray(block.rows)?block.rows:[]);
        return;
      }

      return;
    }

    const html=String(block||"");
    const host=document.createElement("div");
    host.innerHTML=html;

    const desc=host.querySelector(".kp-description");
    if(desc){
      children.push(
        paragraph([run(desc.textContent||"",{size:18})],{after:0,line:260})
      );
      return;
    }

    const specs=host.querySelector(".specs-table");
    if(specs){
      const rows=[...specs.querySelectorAll("tbody tr")].map(tr=>{
        const cells=[...tr.querySelectorAll("td")];
        return[cells[0]?.textContent?.trim()||"",cells[1]?.textContent?.trim()||""];
      });
      addDocxSpecsTable(rows);
      return;
    }

    const note=host.querySelector(".kp-note");
    if(note){
      addDocxNote(note.textContent?.trim()||"");
      return;
    }

    const video=host.querySelector("a.video-button");
    if(video){
      addDocxVideo(p.videoUrl);
      return;
    }

    const priceBlock=host.querySelector(".price-block");
    if(priceBlock){
      [...priceBlock.querySelectorAll(".price-line")].forEach(line=>{
        const isDiscount=line.classList.contains("discount");
        children.push(
          paragraph([
            run(line.textContent||"",{
              size:20,
              bold:true,
              color:isDiscount?RED:undefined
            })
          ],{after:isDiscount?80:55})
        );
      });
      children.push(blank(80));
      return;
    }

    const availability=host.querySelector(".availability");
    if(availability){
      const isOrder=availability.classList.contains("order");
      children.push(
        paragraph([
          run(availability.textContent||"",{
            size:17,
            bold:true,
            color:isOrder?"B96A00":GREEN
          })
        ],{after:70})
      );
      return;
    }

    const comment=host.querySelector(".price-comment");
    if(comment){
      children.push(
        paragraph([
          run(comment.textContent||"",{size:15,color:MUTED})
        ],{after:110,line:220})
      );
    }
  }

  for(let i=0;i<state.products.length;i++){

    const p=state.products[i];
    const pages=await paginateProduct(p,i);

    for(let pageIndex=0;pageIndex<pages.length;pageIndex++){

      if(pageIndex>0){
        children.push(
          paragraph([
            run(`Продолжение предложения — оборудование №${i+1}`,{size:12,color:MUTED,bold:true})
          ],{after:100,line:220})
        );
      }

      const pageHtml=String(pages[pageIndex]||"");

      if(pageIndex===0){

        children.push(
          paragraph([
            run("Коммерческое предложение",{size:25,bold:true})
          ],{after:70,line:270})
        );

        children.push(
          paragraph([
            run(p.productName||`Оборудование №${i+1}`,{size:22,bold:true})
          ],{after:150,line:270})
        );

        const photoParagraphs=[];
        for(const id of p.photoIds||[]){
          const blob=await getPhoto(id).catch(()=>null);
          if(!blob)continue;
          const bytes=await blobToUint8Array(blob);
          const size=getPhotoSize(p,id);
          const px=Math.min(300,Math.max(120,Math.round(size*MM_TO_PX)));
          photoParagraphs.push(
            new docx.ImageRun({
              data:bytes,
              transformation:{width:px,height:px},
              type:blob.type==="image/png"?"png":"jpg"
            })
          );
        }

        if(photoParagraphs.length){
          children.push(
            paragraph(photoParagraphs,{
              alignment:docx.AlignmentType.CENTER,
              after:140
            })
          );
        }
      }

      // paginateProduct() возвращает готовую HTML-страницу целиком.
      // Заголовок и фото уже добавляются выше в DOCX, поэтому из HTML
      // извлекаем только содержимое после них, сохраняя порядок блоков.
      if(pageHtml){
        const host=document.createElement("div");
        host.innerHTML=pageHtml;

        const contentRoot=host.querySelector(".kp-content")||host;
        const contentNodes=[
          ...contentRoot.querySelectorAll(
            ".kp-description, .specs-table, .kp-note, .video-button, .price-block, .availability, .price-comment"
          )
        ];

        for(const node of contentNodes){
          const wrapper=document.createElement("div");
          wrapper.appendChild(node.cloneNode(true));
          addDocxPageBlock(wrapper.innerHTML,p);
        }
      }

      // Фиксируем содержимое этой страницы в отдельной секции DOCX.
      pageChildren.push(children);
      children=[];
    }
  }

  // =========================================================
  // FIXED FOOTER CONTENT
  // =========================================================

  const footerLeft=[
    paragraph([run("АЛЬФАПРОМ",{size:15,bold:true,color:"FFFFFF"})],{after:10}),
    paragraph([run("Оборудование для пищевого производства и упаковки",{size:11,bold:true,color:"FFFFFF"})],{after:0,line:190})
  ];

  const footerRight=[];
  if(state.managerName.trim()){
    footerRight.push(paragraph([run(state.managerName,{size:12,bold:true,color:"FFFFFF"})],{alignment:docx.AlignmentType.RIGHT,after:5}));
  }
  if(state.managerPhone.trim()){
    footerRight.push(paragraph([run(state.managerPhone,{size:11,color:"FFFFFF"})],{alignment:docx.AlignmentType.RIGHT,after:3}));
  }
  footerRight.push(paragraph([run("8 (800) 200-29-23",{size:11,color:"FFFFFF"})],{alignment:docx.AlignmentType.RIGHT,after:3}));
  footerRight.push(paragraph([run("alfaprom.org",{size:11,bold:true,color:"FFFFFF"})],{alignment:docx.AlignmentType.RIGHT,after:0}));

  function makeOrangeFooterTable(){
    const leftW=Math.round(CONTENT_W*.62);
    const rightW=CONTENT_W-leftW;
    return new docx.Table({
      width:{size:CONTENT_W,type:docx.WidthType.DXA},
      columnWidths:[leftW,rightW],
      rows:[new docx.TableRow({cantSplit:true,children:[
        new docx.TableCell({
          width:{size:leftW,type:docx.WidthType.DXA},shading:{fill:ORANGE},
          margins:{top:100,bottom:100,left:0,right:100},
          borders:{top:{style:docx.BorderStyle.SINGLE,size:10,color:ORANGE},bottom:{style:docx.BorderStyle.NONE,size:0,color:ORANGE},left:{style:docx.BorderStyle.NONE,size:0,color:ORANGE},right:{style:docx.BorderStyle.NONE,size:0,color:ORANGE}},
          children:footerLeft
        }),
        new docx.TableCell({
          width:{size:rightW,type:docx.WidthType.DXA},shading:{fill:ORANGE},
          margins:{top:100,bottom:100,left:100,right:0},
          borders:{top:{style:docx.BorderStyle.SINGLE,size:10,color:ORANGE},bottom:{style:docx.BorderStyle.NONE,size:0,color:ORANGE},left:{style:docx.BorderStyle.NONE,size:0,color:ORANGE},right:{style:docx.BorderStyle.NONE,size:0,color:ORANGE}},
          children:footerRight
        })
      ]})],
      borders:{top:{style:docx.BorderStyle.SINGLE,size:10,color:ORANGE},bottom:{style:docx.BorderStyle.NONE,size:0,color:ORANGE},left:{style:docx.BorderStyle.NONE,size:0,color:ORANGE},right:{style:docx.BorderStyle.NONE,size:0,color:ORANGE},insideHorizontal:{style:docx.BorderStyle.NONE,size:0,color:ORANGE},insideVertical:{style:docx.BorderStyle.NONE,size:0,color:ORANGE}}
    });
  }

  // «Почему мы?» теперь является частью Body первой страницы.
  // В Footer остаётся только фиксированная оранжевая контактная полоса.
  const savedChildren=children;
  children=[];
  addDocxAdvantages();
  const whyUsChildren=children;
  children=savedChildren;

  if(pageChildren.length){
    pageChildren[0]=[
      ...pageChildren[0],
      ...whyUsChildren
    ];
  }

  function makeDocxFooter(){
    return new docx.Footer({
      children:[makeOrangeFooterTable()]
    });
  }

  // =========================================================
  // ДОКУМЕНТ — ОДНА SECTION НА КАЖДУЮ СТРАНИЦУ
  // =========================================================

  const sections=pageChildren.map((pageContent,index)=>({
    properties:{
      type:docx.SectionType.NEXT_PAGE,
      page:{
        size:{width:PAGE_W,height:PAGE_H},
        margin:{
          top:1560,
          right:MR,
          bottom:index===0?2050:1050,
          left:ML,
          header:250,
          footer:300
        }
      }
    },
    headers:{
      default:makeDocxHeader()
    },
    footers:{
      default:makeDocxFooter()
    },
    children:pageContent
  }));

  if(!sections.length){
    sections.push({
      properties:{
        page:{
          size:{width:PAGE_W,height:PAGE_H},
          margin:{top:1560,right:MR,bottom:1050,left:ML,header:250,footer:300}
        }
      },
      headers:{default:makeDocxHeader()},
      footers:{default:makeDocxFooter()},
      children:[]
    });
  }

  const doc=new docx.Document({
    styles:{
      default:{
        document:{
          run:{font:"Arial",size:18},
          paragraph:{spacing:{line:240}}
        }
      }
    },
    sections
  });

  return docx.Packer.toBlob(doc);
}


async function downloadDOCX(){

  const b=document.getElementById("downloadDocxBtn");

  b.disabled=true;
  b.textContent="Формирование DOCX...";

  try{

    const blob=await createDocx();

    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");

    a.href=url;
    a.download=
      safeFileName(
        state.products[0]?.productName
      )+".docx";

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(()=>{
      URL.revokeObjectURL(url);
    },1000);

  }catch(e){

    console.error(e);

    alert(
      "Не удалось сформировать DOCX.\n\n"+
      (e.message||e)
    );

  }finally{

    b.disabled=false;
    b.textContent="Скачать DOCX";

  }
}async function init(){try{await openDB()}catch(e){console.error("IndexedDB error",e)}loadState();managerName.value=state.managerName;managerPhone.value=state.managerPhone;renderProductsEditor();await renderPreview();requestAnimationFrame(fitPreviewPages)}
document.getElementById("downloadPdfBtn").onclick=downloadPDF;document.getElementById("downloadDocxBtn").onclick=downloadDOCX;init();
</script>
